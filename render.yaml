# FrameSense AI - Render.com Infrastructure Blueprint
# Auto-configures persistent WebSockets, healthchecks, and lightweight CPU container

services:
  - type: web
    name: framesense-ai-backend
    env: docker
    dockerfilePath: ./Dockerfile.cloud-cpu
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEVICE_PREFERENCE
        value: cpu
    disk:
      name: framesense-data
      mountPath: /app/data
      sizeGB: 1
